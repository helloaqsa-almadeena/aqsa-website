backend:
  name: github
  repo: aqsa-website.netlify.app   # <- change to your repository
  branch: main
media_folder: "uploads"
public_folder: "/uploads"
collections:
  - name: site
    label: Website Content
    files:
      - name: promotions
        label: Promotions & Offers
        file: data/promotions.json
        fields:
          - label: Offers
            name: promotions
            widget: list
            summary: "{{fields.title}}"
            fields:
              - {label: Title, name: title, widget: string}
              - {label: Description, name: desc, widget: text}
              - {label: Start date, name: start, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
              - {label: End date, name: end, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
              - {label: Active, name: active, widget: boolean, default: true}
              - {label: Image, name: image, widget: image, required: false}
      - name: categories
        label: Product Categories
        file: data/categories.json
        fields:
          - label: Categories
            name: categories
            widget: list
            summary: "{{fields.icon}} {{fields.name}}"
            fields:
              - {label: Name, name: name, widget: string}
              - {label: Emoji icon (shown if no photo), name: icon, widget: string, required: false}
              - {label: Photo, name: image, widget: image, required: false}
      - name: store
        label: Store Details
        file: data/store.json
        fields:
          - {label: Business name, name: name, widget: string}
          - {label: Address, name: address, widget: string}
          - {label: Opening hours, name: hours, widget: string}
          - {label: Phone (leave empty until verified), name: phone, widget: string, required: false}
          - {label: Email (leave empty until verified), name: email, widget: string, required: false}
          - {label: Google Maps link (optional), name: maps_url, widget: string, required: false}
          - {label: Facebook URL, name: facebook, widget: string, required: false}
          - {label: Instagram URL, name: instagram, widget: string, required: false}
          - {label: TikTok URL, name: tiktok, widget: string, required: false}
          - {label: WhatsApp link, name: whatsapp, widget: string, required: false}
