<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AQSA Al Madeena Hypermarket | Al Rigga, Dubai</title>
<meta name="description" content="AQSA Al Madeena Hypermarket – your everyday shopping destination at Al Rigga Metro Station, Exit 1, Dubai. Open daily 7:00 AM – 2:00 AM.">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#0f6b3a;--g2:#27a85c;--gold:#f2b705;--red:#e4002b;--ink:#1f2a26;--mut:#5b6862;--bg:#fff;--soft:#f3f8f5;--line:#e1ebe5;--card:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#4cc480;--g2:#2fae66;--ink:#e8f0ec;--mut:#9fb0a8;--bg:#101714;--soft:#17211c;--line:#27352e;--card:#17211c}}
:root[data-theme="dark"]{--g:#4cc480;--g2:#2fae66;--ink:#e8f0ec;--mut:#9fb0a8;--bg:#101714;--soft:#17211c;--line:#27352e;--card:#17211c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Poppins,Inter,sans-serif;line-height:1.2;margin:0 0 .5em}
a{color:inherit;text-decoration:none}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:60}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:#fff;border-bottom:1px solid #e1ebe5}
.bar{display:flex;align-items:center;justify-content:space-between;height:84px}
.brand{display:flex;align-items:center;gap:10px;font:700 .95rem Poppins,sans-serif;letter-spacing:.02em}
.brand img{height:64px;width:auto;display:block}
nav{display:flex;gap:4px}
nav a{padding:8px 13px;border-radius:99px;font-weight:500;font-size:.93rem;color:#5b6862;transition:.2s}
nav a:hover,nav a.on{background:#f3f8f5;color:#0f6b3a}
.burger{display:none;background:none;border:1px solid #e1ebe5;border-radius:10px;padding:8px 10px;color:#1f2a26;font-size:1.2rem;cursor:pointer}
.btn{display:inline-block;padding:13px 24px;border-radius:99px;font-weight:600;border:2px solid transparent;transition:.2s;cursor:pointer}
.btn.p{background:var(--gold);color:#1f2a26}.btn.p:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(242,183,5,.35)}
.btn.o{border-color:#fff;color:#fff}.btn.o:hover{background:#fff;color:var(--g)}
.btn.g{background:var(--g);color:#fff}.btn.g:hover{transform:translateY(-2px)}
.hero{background:linear-gradient(120deg,#0b4f2c,#12853f);color:#fff;padding:72px 0}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2rem,5vw,3.4rem)}
.hero p{font-size:1.1rem;opacity:.92;max-width:520px}
.tag{display:inline-block;background:rgba(255,255,255,.15);padding:6px 14px;border-radius:99px;font-size:.85rem;margin-bottom:16px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.logo-card{background:#fff;border-radius:28px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center}
.logo-card img{max-width:100%;height:auto}
section{padding:64px 0}.alt{background:var(--soft)}
.eyebrow{color:var(--g2);font-weight:600;font-size:.85rem;text-transform:uppercase;letter-spacing:.1em}
h2{font-size:clamp(1.6rem,3.5vw,2.2rem)}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.grid.w{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:.25s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(15,107,58,.12)}
.ph{aspect-ratio:4/3;display:grid;place-items:center;font-size:3rem;background:linear-gradient(135deg,var(--soft),var(--line));position:relative}
.ph small{position:absolute;bottom:8px;right:10px;font-size:.65rem;color:var(--mut)}
.card .in{padding:16px 18px}.card h3{font-size:1.05rem;margin:0}.card p{margin:.4em 0 0;color:var(--mut);font-size:.92rem}
.ico{font-size:1.8rem}
.info{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px}
.box h3{font-size:1.1rem}
.hrs{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line)}
.note{background:rgba(242,183,5,.15);border-left:4px solid var(--gold);padding:12px 16px;border-radius:8px;font-size:.9rem;margin-top:16px}
.empty{text-align:center;padding:40px;border:2px dashed var(--line);border-radius:20px;color:var(--mut)}
.badge{display:inline-block;background:var(--gold);color:#1f2a26;font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:99px;margin-bottom:8px}
.page-h{background:var(--soft);padding:48px 0;border-bottom:1px solid var(--line)}
.prose{max-width:760px}.prose p{color:var(--mut)}
footer{background:#0b2f1d;color:#d5e5dc;padding:52px 0 28px;font-size:.93rem}
footer h4{color:#fff;margin:0 0 12px;font-family:Poppins,sans-serif}
footer a:hover{color:var(--gold)}
.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:30px}
footer li{list-style:none;margin:6px 0}footer ul{padding:0;margin:0}
.copy{border-top:1px solid rgba(255,255,255,.15);margin-top:30px;padding-top:18px;font-size:.82rem;opacity:.8}
.view{display:none;animation:f .4s}.view.on{display:block}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:860px){.hero .wrap,.info{grid-template-columns:1fr}.fg{grid-template-columns:1fr 1fr}
.burger{display:block}nav{display:none;position:absolute;top:84px;left:0;right:0;background:#fff;flex-direction:column;padding:12px 20px;border-bottom:1px solid #e1ebe5}nav.open{display:flex}}
</style></head><body>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const live=()=>PROMOS.filter(p=>p.active&&p.start<=today()&&today()<=p.end);
const fmt=d=>new Date(d+"T00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const catCards=l=>CATS.slice(0,l||99).map(c=>`<a class="card" href="#categories"><div class="ph">${c[2]?`<img src="${esc(c[2])}" alt="${esc(c[1])}" style="width:100%;height:100%;object-fit:cover">`:`${c[0]}<small>Photo slot</small>`}</div><div class="in"><h3>${c[1]}</h3></div></a>`).join("");
const promoHtml=()=>{const l=live();return l.length?`<div class="grid w">${l.map(p=>`<div class="card"><div class="ph">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.title)}" style="width:100%;height:100%;object-fit:cover">`:"🏷️"}</div><div class="in"><span class="badge">Offer</span><h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p><p><small>Valid ${fmt(p.start)} – ${fmt(p.end)}</small></p></div></div>`).join("")}</div>`:`<div class="empty"><div class="ico">🏷️</div><h3>No current offers listed</h3><p>Please visit the store or check back soon for our latest promotions.</p></div>`};
const store=()=>`<div class="info"><div class="box"><h3>📍 ${esc(CONFIG.name)}</h3><p>${esc(CONFIG.address)}</p><div class="hrs"><span>Opening hours</span><strong>${esc(CONFIG.hours)}</strong></div><div class="note">Please note: the store is not open 24 hours.</div><p><a class="btn g" target="_blank" rel="noopener" href="${CONFIG.mapsUrl}">Get Directions</a></p></div><div class="box"><h3>🚇 Getting here</h3><p>We are located at Al Rigga Metro Station, Exit 1 – just step out of the metro and you are at our door.</p><p style="color:var(--mut)">Tip: add exact walking directions or parking info here once confirmed.</p></div></div>`;
const hd=(t,s)=>`<div class="page-h"><div class="wrap"><span class="eyebrow">${esc(CONFIG.short)}</span><h1>${t}</h1><p style="color:var(--mut);margin:0">${s}</p></div></div>`;
const V={
home:()=>`<div class="hero"><div class="wrap"><div><span class="tag">📍 ${esc(CONFIG.address)}</span><h1>Your Everyday Shopping Destination</h1><p>Discover quality products, everyday essentials, fresh selections, and great value at ${esc(CONFIG.name)}.</p><div class="cta"><a class="btn p" href="#categories">Explore Categories</a><a class="btn o" href="#location">Find Our Store</a></div></div><div class="logo-card"><img src="${LOGO}" alt="${esc(CONFIG.name)} logo"></div></div></div>
<section><div class="wrap"><span class="eyebrow">Current offers</span><h2>Promotional Highlights</h2>${promoHtml()}</div></section>
<section class="alt"><div class="wrap"><span class="eyebrow">Browse</span><h2>Product Categories</h2><div class="grid">${catCards(8)}</div><p><a class="btn g" href="#categories">View all categories</a></p></div></section>
<section><div class="wrap"><span class="eyebrow">Why us</span><h2>Why Shop With Us</h2><div class="grid">${WHY.map(w=>`<div class="box"><div class="ico">${w[0]}</div><h3>${w[1]}</h3><p style="color:var(--mut);margin:0">${w[2]}</p></div>`).join("")}</div></div></section>
<section class="alt"><div class="wrap"><span class="eyebrow">Visit us</span><h2>Store Information</h2>${store()}</div></section>`,
about:()=>hd("About Us","Your neighbourhood hypermarket in the heart of Dubai")+`<section><div class="wrap prose"><h2>Welcome to ${esc(CONFIG.name)}</h2><p>${esc(CONFIG.name)} is a neighbourhood shopping destination at Al Rigga Metro Station, Exit 1, Dubai. We bring together everyday groceries, household essentials and a wide range of products in one convenient place.</p><h3>The shopping experience</h3><p>Our store is designed to make daily shopping simple and comfortable, so you can find what you need and get on with your day.</p><h3>Customer-focused</h3><p>Our customers are at the heart of everything we do. Opening hours: ${esc(CONFIG.hours)}.</p><p class="note">Editable: add your store story, founding year and team details here once confirmed.</p></div></section><section class="alt"><div class="wrap"><h2>Find us</h2>${store()}</div></section>`,
categories:()=>hd("Product Categories","Explore what you can find in store")+`<section><div class="wrap"><div class="grid">${catCards()}</div><p class="note">Category list is editable in the CATS section of the site configuration. Product availability may vary in store.</p></div></section>`,
promotions:()=>hd("Promotions & Offers","Only active, in-date offers are displayed")+`<section><div class="wrap">${promoHtml()}</div></section>`,
location:()=>hd("Store Location","Visit us at Al Rigga Metro Station, Exit 1")+`<section><div class="wrap">${store()}</div></section>`,
contact:()=>hd("Contact Us","We would be glad to hear from you")+`<section><div class="wrap info"><div class="box"><h3>Contact details</h3><p>📞 ${esc(CONFIG.phone)}</p><p>✉️ ${esc(CONFIG.email)}</p><p>📍 ${esc(CONFIG.address)}</p><p>🕒 ${esc(CONFIG.hours)}</p><div class="note">Phone and email are placeholders. Add verified details in CONFIG.</div></div><div class="box"><h3>Visit the store</h3><p>We are a physical store – the easiest way to reach us is to drop in.</p><a class="btn g" target="_blank" rel="noopener" href="${CONFIG.mapsUrl}">Get Directions</a></div></div></section>`,
privacy:()=>hd("Privacy Policy","Placeholder – replace with your approved policy")+`<section><div class="wrap prose"><p>This is a placeholder. Please have your privacy policy written or reviewed by a qualified professional before publishing, and add it here.</p></div></section>`,
terms:()=>hd("Terms & Conditions","Placeholder – replace with your approved terms")+`<section><div class="wrap prose"><p>This is a placeholder. Please have your terms and conditions written or reviewed by a qualified professional before publishing, and add them here.</p></div></section>`
};
function route(keep){let h=(location.hash||"#home").slice(1);if(!V[h])h="home";
 $("#app").innerHTML=`<div class="view on">${V[h]()}</div>`;
 document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.hash==="#"+h));
 $("#nav").classList.remove("open");$("#bg").setAttribute("aria-expanded","false");if(!keep)window.scrollTo(0,0);
 try{document.title=(h==="home"?"":PAGES.find(p=>p[0]===h)?.[1]+" | ")+"AQSA Al Madeena Hypermarket"}catch(e){}}
$("#lg").src=LOGO;
$("#nav").innerHTML=PAGES.map(p=>`<a href="#${p[0]}">${p[1]}</a>`).join("");
$("#bg").onclick=()=>{const o=$("#nav").classList.toggle("open");$("#bg").setAttribute("aria-expanded",o)};
function buildFooter(){const so=Object.entries(CONFIG.social).map(([k,v])=>`<li>${v?`<a href="${esc(v)}" target="_blank" rel="noopener">${k}</a>`:`${k}: <em>[add link]</em>`}</li>`).join("");
$("#ft").innerHTML=`<div><h4>${esc(CONFIG.short)}</h4><p>Your everyday shopping destination in Dubai.</p></div><div><h4>Explore</h4><ul>${PAGES.map(p=>`<li><a href="#${p[0]}">${p[1]}</a></li>`).join("")}</ul></div><div><h4>Visit</h4><ul><li>${esc(CONFIG.address)}</li><li>${esc(CONFIG.hours)}</li><li>${esc(CONFIG.phone)}</li><li>${esc(CONFIG.email)}</li></ul></div><div><h4>Follow</h4><ul>${so}<li><a href="#privacy">Privacy Policy</a></li><li><a href="#terms">Terms &amp; Conditions</a></li></ul></div>`;
$("#cp").textContent="© "+new Date().getFullYear()+" "+CONFIG.name+". All rights reserved.";}buildFooter();
window.addEventListener("hashchange",()=>route());route();
const J=u=>fetch(u,{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject());
Promise.allSettled([J("data/promotions.json"),J("data/store.json"),J("data/categories.json")]).then(([p,st,c])=>{
 if(p.status==="fulfilled"&&Array.isArray(p.value.promotions))PROMOS=p.value.promotions;
 if(st.status==="fulfilled"){const d=st.value;["name","address","hours","phone","email"].forEach(k=>{if(d[k])CONFIG[k]=d[k]});
  if(d.maps_url)CONFIG.mapsUrl=d.maps_url;else if(d.address)CONFIG.mapsUrl="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(d.address);
  [["facebook","Facebook"],["instagram","Instagram"],["tiktok","TikTok"],["whatsapp","WhatsApp"]].forEach(([k,L])=>{if(d[k])CONFIG.social[L]=d[k]})}
 if(c.status==="fulfilled"&&Array.isArray(c.value.categories)&&c.value.categories.length)CATS=c.value.categories.map(x=>[x.icon||"🛒",x.name,x.image||""]);
 buildFooter();route(true)});
</script></body></html>
